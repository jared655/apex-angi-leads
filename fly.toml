# APEX Drafting lead-desk API (always-on). Suggested name; rename if taken.
app = "apex-angi-leads-api"
primary_region = "dfw"

[build]
  dockerfile = "server/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATABASE_PATH = "/data/apex.sqlite"
  PROXY_EXPO_WEB = "0"
  NODE_ENV = "production"
  NODE_OPTIONS = "--experimental-sqlite"

# Public HTTPS on *.fly.dev. SQLite + a volume => keep exactly one Machine.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[mounts]
  source = "apex_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
